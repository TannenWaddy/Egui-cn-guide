site_name: Egui中文指南
site_url: https://tannenwaddy.github.io/Egui-cn-guide/
site_description: Egui 中文教程 - 从入门到实战
site_author: Egui中文指南

repo_name: TannenWaddy/Egui-cn-guide
repo_url: https://github.com/TannenWaddy/Egui-cn-guide

theme:
  name: material
  language: zh
  font:
    text: HarmonyOS Sans SC
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

nav:
  - 教程:
    - 第一章 认识 egui: 教程/chapter_1.md
    - 第二章 快速开始: 教程/chapter_2.md
    - 第三章 即时模式 GUI: 教程/chapter_3.md
    - 第四章 核心概念: 教程/chapter_4.md
    - 第五章 内置控件: 教程/chapter_5.md
    - 第六章 布局: 教程/chapter_6.md
    - 第七章 容器：面板、窗口与滚动区: 教程/chapter_7.md
    - 第八章 文本编辑: 教程/chapter_8.md
    - 第九章 图片: 教程/chapter_9.md
    - 第十章 字体与样式: 教程/chapter_10.md
    - 第十一章 自定义控件: 教程/chapter_11.md
    - 第十二章 eframe 与后端集成: 教程/chapter_12.md
    - 第十三章 实战技巧与常见问题: 教程/chapter_13.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
